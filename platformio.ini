; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = default

[env]
platform = espressif32 @ 6.12.0
framework = arduino
; 115200 was dropping characters mid-line under the metrics output volume
monitor_speed = 460800
lib_deps =
    nanopb/Nanopb @ 0.4.91
    knolleary/PubSubClient @ 2.8.0
    NeoPixelBus @ 2.8.4
    https://github.com/BlumAmir/TimeSyncClientArduino.git
    256dpi/MQTT @ 2.5.2
    bblanchon/ArduinoJson @ 6.21.5
    tobiasschuerg/ESP8266 Influxdb @ 3.13.2

[common]
build_flags =
    -DMQTT_MAX_PACKET_SIZE=25000
    -DMQTT_KEEPALIVE=5
    -DMQTT_SOCKET_TIMEOUT=5

; Metrics are always printed to serial. Add METRICS_INFLUXDB_ENABLED to an env
; to ALSO push them to InfluxDB -- leave it off while the server is down,
; otherwise every report blocks on a failing HTTP write.
[metrics_influx]
build_flags =
    -DMETRICS_INFLUXDB_ENABLED

[env:default]
; ESP32-S3-WROOM-1 N16R8 (16MB flash, 8MB octal PSRAM).
; This board def already sets flash size, the 16MB partition table,
; qio_opi memory type, BOARD_HAS_PSRAM and USB CDC on boot.
board = 4d_systems_esp32s3_gen4_r8n16
build_flags =
    ${common.build_flags}
    -DDATA_PIN=2
    -DTIME_SERVER_IP=\"10.0.1.200\"
    -DMQTT_BROKER_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_IP=\"10.0.1.200\"
    -DLED_SEQ_SERVICE_IP=\"10.0.1.200\"
    -DINFLUXDB_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_PORT=\"8081\"
    -DLED_SEQ_SERVICE_PORT=\"8082\"
    -DINFLUXDB_PORT=\"8086\"
    -DTIME_SYNC_DEBUG
; upload_protocol = espota
; upload_port = ring11.local
lib_deps =
    ${env.lib_deps}
    ; ../kivsee-render/
    https://github.com/KivSee/kivsee-render.git

[env:sapir]
board = esp32dev
build_flags =
    ${common.build_flags}
    ${metrics_influx.build_flags}
    -DDATA_PIN=0
    -DTIME_SERVER_IP=\"192.168.1.9\"
    -DMQTT_BROKER_IP=\"192.168.1.9\"
    -DLED_OBJECT_SERVICE_IP=\"192.168.1.9\"
    -DLED_OBJECT_SERVICE_PORT=\"8081\"
    -DLED_SEQ_SERVICE_IP=\"192.168.1.9\"
    -DLED_SEQ_SERVICE_PORT=\"8082\"
    -DTIME_SYNC_DEBUG
upload_protocol = espota
upload_port = 192.168.1.18
lib_deps =
    ${env.lib_deps}
    https://github.com/KivSee/kivsee-render.git

[env:bigler]
board = esp32dev
build_flags =
    ${common.build_flags}
    ${metrics_influx.build_flags}
    -DDATA_PIN=2
    -DTIME_SERVER_IP=\"10.0.0.200\"
    -DMQTT_BROKER_IP=\"10.0.0.200\"
    -DLED_OBJECT_SERVICE_IP=\"10.0.0.200\"
    -DLED_SEQ_SERVICE_IP=\"10.0.0.200\"
    -DINFLUXDB_IP=\"10.0.0.200\"
    -DLED_OBJECT_SERVICE_PORT=\"8081\"
    -DLED_SEQ_SERVICE_PORT=\"8082\"
    -DINFLUXDB_PORT=\"8086\"
    -DTIME_SYNC_DEBUG
lib_deps =
    ${env.lib_deps}
    https://github.com/KivSee/kivsee-render.git

[env:peacock]
board = esp32dev
build_flags =
    ${common.build_flags}
    -DDATA_PIN=2
    -DTIME_SERVER_IP=\"10.0.1.200\"
    -DMQTT_BROKER_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_IP=\"10.0.1.200\"
    -DLED_OBJECT_SERVICE_PORT=\"8081\"
    -DLED_SEQ_SERVICE_IP=\"10.0.1.200\"
    -DLED_SEQ_SERVICE_PORT=\"8082\"
    -DINFLUXDB_IP=\"10.0.1.200\"
    -DINFLUXDB_PORT=\"8086\"
    -DTIME_SYNC_DEBUG
; upload_protocol = espota
; upload_port = 10.0.0.17
lib_deps =
    ${env.lib_deps}
    ; ../kivsee-render/
    https://github.com/KivSee/kivsee-render.git
