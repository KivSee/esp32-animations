; sapir's DTIME_SERVER_IP=\"192.168.1.10\"
[env:sapir]
board = esp32dev
build_flags = 
	${common.build_flags}
	-DNUM_LEDS=800
	-DDATA_PIN=0
	-DTIME_SERVER_IP=\"192.168.1.9\"
	-DMQTT_BROKER_IP=\"192.168.1.9\"
	-DTIME_SYNC_DEBUG
; upload_protocol = espota
; upload_port = 192.168.1.31
 ;upload_port = /dev/cu.usbserial-0001
;/dev/cu.SLAB_USBtoUART
;monitor_port = /dev/cu.usbserial-0001
lib_deps =
    ${env.lib_deps}

	